name: build

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: jobs only read the repository. A job that needs more must ask for it itself.
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Verify (tests, coverage gate, format check)
        run: mvn verify -Dspotless.apply.skip=true

  # Secrets cannot be read in a job-level `if`, so this job only reports whether SNYK_TOKEN is set.
  snyk-token:
    runs-on: ubuntu-latest
    outputs:
      present: ${{ steps.check.outputs.present }}
    steps:
      - id: check
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: echo "present=$([ -n "$SNYK_TOKEN" ] && echo true || echo false)" >> "$GITHUB_OUTPUT"

  # Optional dependency scan: runs only when the repository has a SNYK_TOKEN secret, shown as skipped otherwise
  # (also on pull requests from forks, which get no secrets).
  snyk:
    needs: snyk-token
    if: needs.snyk-token.outputs.present == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - uses: snyk/actions/setup@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      - name: Snyk test (all modules, high severity and above)
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        run: snyk test --maven-aggregate-project --severity-threshold=high
